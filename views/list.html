<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Logs Viewer Application"/>
  <title>Logs Viewer v1.4.5</title>

  <style>
    :root {
      --bg: #f0f2f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #059669;
      --accent-dark: #047857;
      --accent-soft: #ecfdf5;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --slate: #334155;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 16px rgba(15, 23, 42, 0.06);
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
      --fs-xs: 0.8125rem;
      --fs-sm: 0.9375rem;
      --fs-base: 1.0625rem;
      --fs-md: 1.125rem;
      --fs-lg: 1.375rem;
      --fs-xl: 1.625rem;
    }

    html { font-size: 18px; }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      margin: 0;
      padding: 16px 20px 24px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container { max-width: 100%; margin: 0 auto; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title h1 {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .version-badge {
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border: 1px solid #a7f3d0;
    }

    .header-meta {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Toolbar */
    .bar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .left, .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .btn-group { display: flex; gap: 4px; }

    .btn {
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      background: var(--accent);
      font-weight: 600;
      font-size: var(--fs-base);
      transition: background 0.15s, transform 0.08s, opacity 0.15s;
      user-select: none;
    }

    .btn:hover:not([disabled]) { filter: brightness(1.05); }
    .btn:active:not([disabled]) { transform: scale(0.98); }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary { background: var(--blue); }
    .btn.neutral { background: var(--slate); }
    .btn.notify-on { background: #7c3aed; }
    .btn.notify-off { background: #94a3b8; }
    .btn.notify-denied { background: #b45309; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text);
    }

    .pill-label { color: var(--text-muted); font-weight: 500; }

    select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 600;
      font-size: var(--fs-sm);
      color: var(--text);
    }

    .error-message {
      display: none;
      color: var(--red);
      text-align: center;
      margin: 0 0 12px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: var(--fs-base);
      background: var(--red-soft);
      border: 1px solid #fecaca;
      border-radius: var(--radius);
    }

    /* New logs banner */
    #newBanner {
      display: none;
      position: sticky;
      top: 0;
      z-index: 999;
      margin: 0 0 12px;
      padding: 11px 16px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      font-weight: 600;
      font-size: var(--fs-base);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.12s;
    }

    #newBanner:hover { transform: translateY(-1px); }

    /* Filters (shared — desktop grid + mobile drawer) */
    .filter-panel {
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .filter-toggle {
      display: none;
      width: 100%;
      padding: 12px 14px;
      border: none;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      font-size: var(--fs-base);
      cursor: pointer;
      text-align: left;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .filter-toggle-icon {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .filter-panel.is-open .filter-toggle-icon { transform: rotate(180deg); }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 12px 12px;
    }

    .filter-panel .filter-toggle + .filter-grid {
      border-top: 1px solid var(--border);
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .filter-field label {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    /* Table (desktop / tablet) */
    .table-container {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      height: calc(100dvh - 260px);
      min-height: 320px;
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .scroll-hint {
      display: none;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 8px;
      font-weight: 500;
    }

    /* Card list (mobile) */
    .card-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100dvh - 280px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }

    .log-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .log-card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .log-num {
      font-weight: 700;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      min-width: 28px;
    }

    .log-ts {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      color: var(--slate);
      flex: 1;
      min-width: 0;
    }

    .log-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .log-card-body {
      margin: 0;
      padding: 10px 12px 12px;
      display: grid;
      gap: 8px;
    }

    .log-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: start;
      font-size: var(--fs-sm);
    }

    .log-row dt {
      margin: 0;
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      padding-top: 2px;
    }

    .log-row dd {
      margin: 0;
      min-width: 0;
      word-break: break-word;
    }

    .log-row dd.col-url { color: var(--blue); font-size: var(--fs-sm); }
    .log-row dd.col-ip { font-family: var(--mono); font-weight: 600; color: #0f766e; font-size: var(--fs-sm); }

    td.col-location {
      white-space: normal;
      line-height: 1.35;
    }

    .loc-primary { font-weight: 600; display: block; }
    .loc-detail { font-size: var(--fs-sm); color: var(--text-muted); display: block; }

    table {
      width: 100%;
      min-width: 1820px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: var(--fs-base);
    }

    th, td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      height: 50px;
    }

    thead tr:first-child th {
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: var(--fs-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    tbody tr:nth-child(even) td { background: #fafbfc; }
    tbody tr:hover td { background: var(--blue-soft); }

    td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.col-num {
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    td.col-ts {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      color: var(--slate);
    }

    td.col-ip {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: #0f766e;
    }

    td.col-url {
      font-size: var(--fs-sm);
      color: var(--blue);
    }

    td.col-user {
      white-space: normal;
      line-height: 1.35;
    }

    .user-pc { font-weight: 600; display: block; }
    .user-name { font-size: var(--fs-sm); color: var(--text-muted); display: block; }

    .filter-input {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      font-size: var(--fs-sm);
      font-weight: 500;
      background: var(--surface);
      color: var(--text);
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }

    .filter-input::placeholder { color: #94a3b8; font-weight: 400; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-get { background: #dbeafe; color: #1d4ed8; }
    .badge-post { background: #fef3c7; color: #b45309; }
    .badge-secret { background: #fce7f3; color: #be185d; }
    .badge-other { background: #f1f5f9; color: #475569; }

    .badge-web { background: var(--accent-soft); color: var(--accent-dark); }
    .badge-postman { background: #fff7ed; color: #c2410c; }

    .badge-flag {
      background: #f1f5f9;
      color: var(--slate);
      font-family: var(--mono);
      font-size: var(--fs-sm);
      text-transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: var(--fs-base);
    }

    .empty-state-icon { font-size: 2.25rem; margin-bottom: 8px; opacity: 0.5; }

    /* Loader */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(240, 242, 248, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(3px);
    }

    .loader-card {
      width: min(380px, 90vw);
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .loader-label {
      font-weight: 600;
      font-size: var(--fs-md);
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .progress {
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      animation: slide 0.9s ease-in-out infinite;
      border-radius: 999px;
    }

    @keyframes slide {
      0% { transform: translateX(-70%); }
      100% { transform: translateX(280%); }
    }

    /* ── Tablet ── */
    @media (max-width: 1200px) {
      .filter-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .table-container {
        height: calc(100dvh - 320px);
      }

      .scroll-hint { display: block; }
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body {
        padding: 10px 10px max(16px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        margin-bottom: 12px;
        padding-bottom: 10px;
      }

      .header-title h1 { font-size: var(--fs-lg); }
      .header-meta { font-size: var(--fs-sm); }

      .bar {
        padding: 10px;
        gap: 10px;
      }

      .left {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .btn-group {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: 100%;
      }

      .btn {
        padding: 10px 6px;
        font-size: var(--fs-sm);
      }

      .bar-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
      }

      .bar-stats .pill { flex: 1; justify-content: center; min-width: calc(50% - 3px); }

      .filter-toggle { display: flex; }

      .filter-grid {
        display: none;
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .filter-panel.is-open .filter-grid { display: grid; }

      .table-container { display: none !important; }

      .card-list {
        display: flex;
        max-height: calc(100dvh - 320px);
      }

      #newBanner {
        font-size: var(--fs-sm);
        padding: 10px 12px;
      }
    }

    @media (max-width: 400px) {
      .btn-group { grid-template-columns: repeat(2, 1fr); }
      .log-row { grid-template-columns: 72px 1fr; }

      .filter-input,
      select { font-size: var(--fs-base); }
    }
  </style>
</head>

<body>
  <div class="loader-overlay" id="loader">
    <div class="loader-card">
      <div class="loader-label">Loading logs…</div>
      <div class="progress"><div></div></div>
    </div>
  </div>

  <div class="container">
    <header class="header">
      <div class="header-title">
        <h1>Logs Viewer</h1>
        <span class="version-badge">v1.4.5</span>
      </div>
      <div class="header-meta">Real-time request monitor</div>
    </header>

    <div id="errorMessage" class="error-message"></div>
    <div id="newBanner" title="Click to refresh results"></div>

    <div class="bar">
      <div class="left">
        <div class="btn-group">
          <button id="firstBtn" class="btn neutral" type="button">First</button>
          <button id="prevBtn" class="btn secondary" type="button" disabled>Prev</button>
          <button id="nextBtn" class="btn secondary" type="button" disabled>Next</button>
          <button id="lastBtn" class="btn neutral" type="button">Last</button>
        </div>

        <div class="bar-stats">
          <span class="pill" id="pagePill">Page 1</span>
          <span class="pill" id="countPill">0 rows</span>

          <label class="pill">
            <span class="pill-label">Page size</span>
            <select id="pageSize">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>

          <button type="button" id="notifyBtn" class="btn notify-off" title="Browser &amp; desktop alerts for new Firebase logs">
            Enable alerts
          </button>
        </div>
      </div>
    </div>

    <section class="filter-panel" id="filterPanel" aria-label="Column filters">
      <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterGrid">
        <span>Filters</span>
        <span class="filter-toggle-icon" aria-hidden="true">▼</span>
      </button>
      <div class="filter-grid" id="filterGrid">
        <div class="filter-field">
          <label for="f-timestamp">Timestamp</label>
          <input class="filter-input" id="f-timestamp" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-location">Location</label>
          <input class="filter-input" id="f-location" placeholder="Country, region, city…">
        </div>
        <div class="filter-field">
          <label for="f-method">Method</label>
          <input class="filter-input" id="f-method" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-source">Source</label>
          <input class="filter-input" id="f-source" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-ip">IP</label>
          <input class="filter-input" id="f-ip" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-url">URL</label>
          <input class="filter-input" id="f-url" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-flag">Flag</label>
          <input class="filter-input" id="f-flag" placeholder="Filter…">
        </div>
        <div class="filter-field">
          <label for="f-computername">PC / User</label>
          <input class="filter-input" id="f-computername" placeholder="Filter…">
        </div>
      </div>
    </section>

    <p class="scroll-hint">Swipe horizontally to see all columns</p>

    <div class="table-container" id="tableWrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th style="width:52px;">#</th>
            <th style="width:175px;">Timestamp</th>
            <th style="width:280px;">Location</th>
            <th style="width:130px;">Method</th>
            <th style="width:100px;">Source</th>
            <th style="width:140px;">IP Address</th>
            <th style="width:360px;">Request URL</th>
            <th style="width:72px;">Flag</th>
            <th style="width:340px;">PC / Username</th>
          </tr>
        </thead>

        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="card-list" id="cardList" style="display:none;" aria-live="polite"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      const errorDiv = document.getElementById("errorMessage");
      const tableWrap = document.getElementById("tableWrap");
      const tbody = document.getElementById("tbody");
      const cardList = document.getElementById("cardList");
      const filterPanel = document.getElementById("filterPanel");
      const filterToggle = document.getElementById("filterToggle");
      const newBanner = document.getElementById("newBanner");

      const mobileMq = window.matchMedia("(max-width: 768px)");

      function isMobile() { return mobileMq.matches; }

      function showResultsView() {
        if (isMobile()) {
          tableWrap.style.display = "none";
          cardList.style.display = "flex";
        } else {
          tableWrap.style.display = "block";
          cardList.style.display = "none";
        }
      }

      filterToggle.addEventListener("click", () => {
        const open = filterPanel.classList.toggle("is-open");
        filterToggle.setAttribute("aria-expanded", open ? "true" : "false");
      });

      mobileMq.addEventListener("change", () => {
        showResultsView();
        renderTable();
      });

      const firstBtn = document.getElementById("firstBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const lastBtn = document.getElementById("lastBtn");
      const pageSizeSel = document.getElementById("pageSize");
      const pagePill = document.getElementById("pagePill");
      const countPill = document.getElementById("countPill");
      const notifyBtn = document.getElementById("notifyBtn");

      const NOTIFY_STORAGE_KEY = "logViewerNotifications";
      let notifyEnabled = localStorage.getItem(NOTIFY_STORAGE_KEY) === "1";

      const filters = {
        timestamp: document.getElementById("f-timestamp"),
        location: document.getElementById("f-location"),
        method: document.getElementById("f-method"),
        source: document.getElementById("f-source"),
        ip: document.getElementById("f-ip"),
        url: document.getElementById("f-url"),
        flag: document.getElementById("f-flag"),
        computername: document.getElementById("f-computername"),
      };

      function showLoader(on) {
        loader.style.display = on ? "flex" : "none";
      }

      function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = "block"; }
      function hideError() { errorDiv.style.display = "none"; }

      function esc(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatMethod(method) {
        const m = (method || "N/A").toUpperCase();
        let cls = "badge-other";
        if (m.startsWith("GET")) cls = "badge-get";
        else if (m.includes("SECRET")) cls = "badge-secret";
        else if (m.startsWith("POST")) cls = "badge-post";
        return `<span class="badge ${cls}">${esc(method || "N/A")}</span>`;
      }

      function formatSource(source) {
        const s = (source || "N/A").toLowerCase();
        const cls = s === "postman" ? "badge-postman" : "badge-web";
        return `<span class="badge ${cls}">${esc(source || "N/A")}</span>`;
      }

      function formatFlag(flag) {
        return `<span class="badge badge-flag">${esc(flag || "—")}</span>`;
      }

      function formatComputername(raw) {
        if (!raw || raw === "N/A") return "—";
        const parts = raw.split("|").map(s => s.trim());
        if (parts.length >= 2) {
          return `<span class="user-pc">${esc(parts[0])}</span><span class="user-name">${esc(parts.slice(1).join(" | "))}</span>`;
        }
        return esc(raw);
      }

      function formatCell(value, fallback = "—") {
        const v = value && value !== "none" ? value : fallback;
        return esc(v);
      }

      function locPart(value) {
        const v = (value || "").trim();
        return v && v.toLowerCase() !== "none" ? v : "";
      }

      function formatLocation(country, region, city) {
        const c = locPart(country);
        const r = locPart(region);
        const t = locPart(city);
        const parts = [c, r, t].filter(Boolean);
        if (!parts.length) return "—";
        if (parts.length === 1) return esc(parts[0]);
        return `<span class="loc-primary">${esc(parts[0])}</span><span class="loc-detail">${esc(parts.slice(1).join(", "))}</span>`;
      }

      function locationTitle(country, region, city) {
        const parts = [locPart(country), locPart(region), locPart(city)].filter(Boolean);
        return parts.join(", ");
      }

      function truncate(str, max) {
        const s = String(str || "");
        return s.length <= max ? s : s.slice(0, max - 1) + "…";
      }

      // ======= browser & desktop notifications (Firebase new_log via SSE) =======
      async function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) return null;
        try {
          return await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        } catch (e) {
          console.warn("Service worker registration failed:", e);
          return null;
        }
      }

      function updateNotifyButton() {
        if (!("Notification" in window)) {
          notifyBtn.disabled = true;
          notifyBtn.textContent = "Alerts unavailable";
          notifyBtn.className = "btn notify-denied";
          return;
        }
        if (Notification.permission === "denied") {
          notifyBtn.disabled = false;
          notifyBtn.textContent = "Alerts blocked";
          notifyBtn.className = "btn notify-denied";
          notifyBtn.title = "Enable notifications in your browser site settings";
          return;
        }
        if (notifyEnabled && Notification.permission === "granted") {
          notifyBtn.textContent = "Alerts on";
          notifyBtn.className = "btn notify-on";
          notifyBtn.title = "Click to turn off browser & desktop notifications";
        } else {
          notifyBtn.textContent = "Enable alerts";
          notifyBtn.className = "btn notify-off";
          notifyBtn.title = "Enable browser & desktop notifications for new Firebase logs";
        }
      }

      function buildNotificationContent(log) {
        const loc = locationTitle(log.country, log.regionName, log.city);
        const title = `New log · ${log.method || "REQUEST"}`;
        const lines = [];
        if (log.ip) lines.push(`IP: ${log.ip}`);
        if (loc && loc !== "—") lines.push(loc);
        if (log.source) lines.push(`Source: ${log.source}`);
        if (log.url) lines.push(truncate(log.url, 100));
        if (log.computername) lines.push(truncate(log.computername, 60));
        const body = lines.length ? lines.join("\n") : "A new request was logged to Firebase.";
        return { title, body };
      }

      async function showLogNotification(log) {
        if (!notifyEnabled || !("Notification" in window) || Notification.permission !== "granted") {
          return;
        }
        const { title, body } = buildNotificationContent(log);
        const options = {
          body,
          tag: "firebase-new-log",
          renotify: true,
          requireInteraction: false,
          silent: false,
          data: { url: window.location.pathname || "/" },
        };

        try {
          const reg = await navigator.serviceWorker.ready;
          if (reg?.showNotification) {
            await reg.showNotification(title, options);
            return;
          }
        } catch (e) {
          console.warn("SW notification failed, falling back:", e);
        }

        const n = new Notification(title, options);
        n.onclick = () => {
          window.focus();
          n.close();
        };
      }

      async function enableNotifications() {
        if (!("Notification" in window)) {
          showError("This browser does not support notifications.");
          return false;
        }
        await registerServiceWorker();
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          notifyEnabled = false;
          localStorage.setItem(NOTIFY_STORAGE_KEY, "0");
          updateNotifyButton();
          if (perm === "denied") {
            showError("Notifications blocked. Allow them in your browser settings for this site.");
          }
          return false;
        }
        notifyEnabled = true;
        localStorage.setItem(NOTIFY_STORAGE_KEY, "1");
        updateNotifyButton();
        await showLogNotification({
          method: "CONNECTED",
          ip: "",
          country: "",
          regionName: "",
          city: "",
          url: "You will receive desktop alerts when new logs are saved to Firebase.",
        });
        return true;
      }

      function disableNotifications() {
        notifyEnabled = false;
        localStorage.setItem(NOTIFY_STORAGE_KEY, "0");
        updateNotifyButton();
      }

      notifyBtn.addEventListener("click", async () => {
        hideError();
        if (notifyEnabled && Notification.permission === "granted") {
          disableNotifications();
          return;
        }
        await enableNotifications();
      });

      (async () => {
        if (notifyEnabled && Notification.permission === "granted") {
          await registerServiceWorker();
        } else if (Notification.permission === "denied") {
          notifyEnabled = false;
          localStorage.setItem(NOTIFY_STORAGE_KEY, "0");
        }
        updateNotifyButton();
      })();

      // ======= state =======
      let hideMineList = true;
      let pageNumber = 1;
      let prevCursor = null;
      let nextCursor = null;
      let lastGood = { items: [], prevCursor: null, nextCursor: null, pageNumber: 1 };
      let pageItems = [];
      let newCount = 0;

      function getFilterObj() {
        return {
          timestamp: filters.timestamp.value.trim(),
          location: filters.location.value.trim(),
          method: filters.method.value.trim(),
          source: filters.source.value.trim(),
          ip: filters.ip.value.trim(),
          url: filters.url.value.trim(),
          flag: filters.flag.value.trim(),
          computername: filters.computername.value.trim(),
        };
      }

      function filtersAreEmpty() {
        return Object.values(filters).every(el => !el.value.trim());
      }

      function hideNewBanner() {
        newBanner.style.display = "none";
        newCount = 0;
      }

      function showNewBanner() {
        newBanner.style.display = "block";
        newBanner.textContent = `${newCount} new log${newCount === 1 ? "" : "s"} available — click to refresh`;
      }

      newBanner.addEventListener("click", async () => {
        hideNewBanner();
        pageNumber = 1;
        await fetchPage("first", null, 1);
      });

      function renderCards() {
        if (pageItems.length === 0) {
          cardList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              No logs match the current filters
            </div>`;
          return;
        }

        let html = "";
        for (let i = 0; i < pageItems.length; i++) {
          const r = pageItems[i];
          const rowNum = pageItems.length - i;
          html += `
            <article class="log-card">
              <header class="log-card-head">
                <span class="log-num">#${rowNum}</span>
                <time class="log-ts">${formatCell(r.timestamp)}</time>
                <div class="log-badges">
                  ${formatMethod(r.method)}
                  ${formatSource(r.source)}
                  ${formatFlag(r.flag)}
                </div>
              </header>
              <dl class="log-card-body">
                <div class="log-row">
                  <dt>Location</dt>
                  <dd>${formatLocation(r.country, r.regionName, r.city)}</dd>
                </div>
                <div class="log-row">
                  <dt>IP</dt>
                  <dd class="col-ip">${formatCell(r.ip)}</dd>
                </div>
                <div class="log-row">
                  <dt>URL</dt>
                  <dd class="col-url">${formatCell(r.url)}</dd>
                </div>
                <div class="log-row">
                  <dt>PC / User</dt>
                  <dd>${formatComputername(r.computername)}</dd>
                </div>
              </dl>
            </article>`;
        }
        cardList.innerHTML = html;
      }

      function renderTable() {
        const emptyHtml = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            No logs match the current filters
          </div>`;

        if (pageItems.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9">${emptyHtml}</td></tr>`;
          cardList.innerHTML = emptyHtml;
        } else {
          let html = "";
          for (let i = 0; i < pageItems.length; i++) {
            const r = pageItems[i];
            const rowNum = pageItems.length - i;
            html += `
              <tr>
                <td class="col-num">${rowNum}</td>
                <td class="col-ts" title="${esc(r.timestamp || "")}">${formatCell(r.timestamp)}</td>
                <td class="col-location" title="${esc(locationTitle(r.country, r.regionName, r.city))}">${formatLocation(r.country, r.regionName, r.city)}</td>
                <td>${formatMethod(r.method)}</td>
                <td>${formatSource(r.source)}</td>
                <td class="col-ip" title="${esc(r.ip || "")}">${formatCell(r.ip)}</td>
                <td class="col-url" title="${esc(r.url || "")}">${formatCell(r.url)}</td>
                <td>${formatFlag(r.flag)}</td>
                <td class="col-user" title="${esc(r.computername || "")}">${formatComputername(r.computername)}</td>
              </tr>`;
          }
          tbody.innerHTML = html;
          renderCards();
        }

        pagePill.textContent = `Page ${pageNumber}`;
        countPill.textContent = `${pageItems.length} row${pageItems.length === 1 ? "" : "s"}`;

        prevBtn.disabled = !prevCursor;
        nextBtn.disabled = !nextCursor;
      }

      function buildUrl(dir, cursorParam) {
        const limit = parseInt(pageSizeSel.value, 10) || 200;
        const url = new URL("/api/requests", window.location.origin);

        url.searchParams.set("limit", String(limit));
        url.searchParams.set("dir", dir);
        url.searchParams.set("hideMineList", hideMineList ? "1" : "0");
        if (cursorParam) url.searchParams.set("cursor", cursorParam);

        const f = getFilterObj();
        for (const [k, v] of Object.entries(f)) {
          if (v) url.searchParams.set(k, v);
        }
        return url.toString();
      }

      async function fetchPage(dir, cursorParam = null, pageOverride = null) {
        hideError();
        showLoader(true);

        try {
          const res = await fetch(buildUrl(dir, cursorParam), { headers: { "Accept": "application/json" } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const items = data.items || [];
          const pCur = data.prevCursor || null;
          const nCur = data.nextCursor || null;

          if ((dir === "next" || dir === "prev") && items.length === 0) {
            if (dir === "next") nextCursor = null;
            if (dir === "prev") prevCursor = null;
            renderTable();
            return;
          }

          pageItems = items;
          prevCursor = pCur;
          nextCursor = nCur;

          if (pageOverride !== null) pageNumber = pageOverride;

          showResultsView();
          renderTable();

          lastGood = { items: pageItems, prevCursor, nextCursor, pageNumber };
        } catch (e) {
          console.error(e);
          showError("Failed to load logs: " + (e?.message || e));

          pageItems = lastGood.items;
          prevCursor = lastGood.prevCursor;
          nextCursor = lastGood.nextCursor;
          pageNumber = lastGood.pageNumber;
          renderTable();
        } finally {
          showLoader(false);
        }
      }

      firstBtn.addEventListener("click", async () => {
        hideNewBanner();
        pageNumber = 1;
        await fetchPage("first", null, 1);
      });

      lastBtn.addEventListener("click", async () => {
        hideNewBanner();
        pageNumber = "LAST";
        await fetchPage("last", null, "LAST");
      });

      nextBtn.addEventListener("click", async () => {
        if (!nextCursor) return;
        hideNewBanner();
        if (pageNumber !== "LAST") pageNumber += 1;
        await fetchPage("next", nextCursor, pageNumber);
      });

      prevBtn.addEventListener("click", async () => {
        if (!prevCursor) return;
        hideNewBanner();
        if (pageNumber !== "LAST") pageNumber = Math.max(1, pageNumber - 1);
        await fetchPage("prev", prevCursor, pageNumber);
      });

      pageSizeSel.addEventListener("change", async () => {
        hideNewBanner();
        pageNumber = 1;
        await fetchPage("first", null, 1);
      });

      let debounce = null;
      Object.values(filters).forEach(el => {
        el.addEventListener("input", () => {
          clearTimeout(debounce);
          debounce = setTimeout(async () => {
            hideNewBanner();
            pageNumber = 1;
            await fetchPage("first", null, 1);
          }, 250);
        });
      });

      try {
        const es = new EventSource("/api/stream");

        es.addEventListener("new_log", async (ev) => {
          let log = {};
          try {
            log = JSON.parse(ev.data || "{}");
          } catch {}

          showLogNotification(log);

          const onFirst = (pageNumber === 1 || pageNumber === "1");
          if (onFirst && filtersAreEmpty() && hideMineList === true) {
            await fetchPage("first", null, 1);
            return;
          }

          newCount++;
          showNewBanner();
        });

        es.addEventListener("error", () => {});
      } catch (e) {
        console.warn("SSE not available:", e);
      }

      fetchPage("first", null, 1);
    });
  </script>
</body>
</html>
